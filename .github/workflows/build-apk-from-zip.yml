name: TimeCam-Studio

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Unpack Android source
        run: |
          unzip -oq TimeCamStudio-Source.zip -d source
          test -f source/TimeCam_Studio_Android/app/build.gradle
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Install SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        working-directory: source/TimeCam_Studio_Android
        run: gradle --no-daemon --stacktrace assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TimeCam-Studio-APK
          path: source/TimeCam_Studio_Android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
